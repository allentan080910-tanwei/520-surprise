<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>520</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    /* 文字雨 canvas 在底层，爱心粒子 canvas 在上层 */
    #canvas  { z-index: 1; }
    #pinkboard { z-index: 2; }
    #text-canvas { z-index: 3; }

    /* 点击提示 */
    #click-hint {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 18px;
      color: #fff;
      text-align: center;
      animation: fadeInOut 2s ease-in-out infinite;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 20px;
    }
    @keyframes fadeInOut {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* 居中文字 - 很幸运能够认识你 */
    #lucky-text {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 48px;
      color: #ff6ec6;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 0 20px rgba(255,110,198,0.6), 0 0 40px rgba(255,110,198,0.3);
      /* 初始隐藏 */
      opacity: 0;
      display: none;
    }

    /* 幸运文字的动画 */
    #lucky-text.show {
      display: block;
      animation: blurToClear 3s ease-out forwards;
    }

    @keyframes blurToClear {
      0% {
        opacity: 0;
        filter: blur(20px);
        transform: translate(-50%, -50%) scale(0.8);
      }
      30% {
        opacity: 0.5;
        filter: blur(12px);
      }
      70% {
        opacity: 0.9;
        filter: blur(3px);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: translate(-50%, -50%) scale(1);
      }
    }
  </style>
</head>
<body>

  <!-- 文字雨 -->
  <canvas id="canvas"></canvas>
  <!-- 粒子爱心 -->
  <canvas id="pinkboard"></canvas>
  <!-- 粒子文字 -->
  <canvas id="text-canvas"></canvas>

  <!-- 点击提示 -->
  <div id="click-hint">点击屏幕开启音乐 🎵</div>

  <!-- 居中祝福文字 - 很幸运能够认识你 -->
  <div id="lucky-text">很幸运能够认识你</div>

  <!-- ========== 文字雨脚本 ========== -->
  <script>
    (function() {
      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;
      }
      resizeCanvas();

      var texts = '520 I LOVE YOU 熊文蓉'.split('');
      var fontSize = 14; // 移动端稍微小一点
      var columns = Math.floor(canvas.width / fontSize);
      var drops = [];
      for (var x = 0; x < columns; x++) {
        drops[x] = Math.random() * -100;
      }

      function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#4a9eff';
        ctx.font = fontSize + 'px arial';
        for (var i = 0; i < drops.length; i++) {
          var text = texts[Math.floor(Math.random() * texts.length)];
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);
          if (drops[i] * fontSize > canvas.height || Math.random() > 0.95) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }
      setInterval(draw, 50); // 降低速度

      window.addEventListener('resize', function() {
        resizeCanvas();
      });
    })();
  </script>

  <!-- ========== 粒子爱心脚本（移动端优化） ========== -->
  <script>
    (function() {
      var settings = {
        particles: {
          length: 300, // 移动端减少粒子数量
          duration: 2,
          velocity: 80, // 稍微降低速度
          effect: -0.75,
          size: 25, // 稍微缩小
        },
      };

      // RequestAnimationFrame polyfill
      (function() {
        var b = 0;
        var c = ["ms", "moz", "webkit", "o"];
        for (var a = 0; a < c.length && !window.requestAnimationFrame; ++a) {
          window.requestAnimationFrame = window[c[a] + "RequestAnimationFrame"];
          window.cancelAnimationFrame = window[c[a] + "CancelAnimationFrame"] || window[c[a] + "CancelRequestAnimationFrame"];
        }
        if (!window.requestAnimationFrame) {
          window.requestAnimationFrame = function(h, e) {
            var d = new Date().getTime();
            var f = Math.max(0, 16 - (d - b));
            var g = window.setTimeout(function() { h(d + f); }, f);
            b = d + f;
            return g;
          };
        }
        if (!window.cancelAnimationFrame) {
          window.cancelAnimationFrame = function(d) { clearTimeout(d); };
        }
      })();

      var Point = (function() {
        function Point(x, y) {
          this.x = (typeof x !== 'undefined') ? x : 0;
          this.y = (typeof y !== 'undefined') ? y : 0;
        }
        Point.prototype.clone = function() { return new Point(this.x, this.y); };
        Point.prototype.length = function(length) {
          if (typeof length == 'undefined')
            return Math.sqrt(this.x * this.x + this.y * this.y);
          this.normalize();
          this.x *= length;
          this.y *= length;
          return this;
        };
        Point.prototype.normalize = function() {
          var length = this.length();
          this.x /= length;
          this.y /= length;
          return this;
        };
        return Point;
      })();

      var Particle = (function() {
        function Particle() {
          this.position = new Point();
          this.velocity = new Point();
          this.acceleration = new Point();
          this.age = 0;
        }
        Particle.prototype.initialize = function(x, y, dx, dy) {
          this.position.x = x; this.position.y = y;
          this.velocity.x = dx; this.velocity.y = dy;
          this.acceleration.x = dx * settings.particles.effect;
          this.acceleration.y = dy * settings.particles.effect;
          this.age = 0;
        };
        Particle.prototype.update = function(deltaTime) {
          this.position.x += this.velocity.x * deltaTime;
          this.position.y += this.velocity.y * deltaTime;
          this.velocity.x += this.acceleration.x * deltaTime;
          this.velocity.y += this.acceleration.y * deltaTime;
          this.age += deltaTime;
        };
        Particle.prototype.draw = function(context, image) {
          function ease(t) { return (--t) * t * t + 1; }
          var size = image.width * ease(this.age / settings.particles.duration);
          context.globalAlpha = 1 - this.age / settings.particles.duration;
          context.drawImage(image, this.position.x - size / 2, this.position.y - size / 2, size, size);
        };
        return Particle;
      })();

      var ParticlePool = (function() {
        var particles, firstActive = 0, firstFree = 0,
            duration = settings.particles.duration;

        function ParticlePool(length) {
          particles = new Array(length);
          for (var i = 0; i < particles.length; i++)
            particles[i] = new Particle();
        }
        ParticlePool.prototype.add = function(x, y, dx, dy) {
          particles[firstFree].initialize(x, y, dx, dy);
          firstFree++;
          if (firstFree == particles.length) firstFree = 0;
          if (firstActive == firstFree) firstActive++;
          if (firstActive == particles.length) firstActive = 0;
        };
        ParticlePool.prototype.update = function(deltaTime) {
          var i;
          if (firstActive < firstFree) {
            for (i = firstActive; i < firstFree; i++) particles[i].update(deltaTime);
          }
          if (firstFree < firstActive) {
            for (i = firstActive; i < particles.length; i++) particles[i].update(deltaTime);
            for (i = 0; i < firstFree; i++) particles[i].update(deltaTime);
          }
          while (particles[firstActive].age >= duration && firstActive != firstFree) {
            firstActive++;
            if (firstActive == particles.length) firstActive = 0;
          }
        };
        ParticlePool.prototype.draw = function(context, image) {
          if (firstActive < firstFree) {
            for (i = firstActive; i < firstFree; i++) particles[i].draw(context, image);
          }
          if (firstFree < firstActive) {
            for (i = firstActive; i < particles.length; i++) particles[i].draw(context, image);
            for (i = 0; i < firstFree; i++) particles[i].draw(context, image);
          }
        };
        return ParticlePool;
      })();

      (function(canvas) {
        var context = canvas.getContext('2d'),
            particles = new ParticlePool(settings.particles.length),
            particleRate = settings.particles.length / settings.particles.duration,
            time;

        function pointOnHeart(t) {
          return new Point(
            160 * Math.pow(Math.sin(t), 3),
            130 * Math.cos(t) - 50 * Math.cos(2*t) - 20 * Math.cos(3*t) - 10 * Math.cos(4*t) + 25
          );
        }

        // 蓝色爱心粒子
        var image = (function() {
          var c = document.createElement('canvas'),
              cx = c.getContext('2d');
          c.width = settings.particles.size;
          c.height = settings.particles.size;
          function to(t) {
            var point = pointOnHeart(t);
            point.x = settings.particles.size / 2 + point.x * settings.particles.size / 350;
            point.y = settings.particles.size / 2 - point.y * settings.particles.size / 350;
            return point;
          }
          cx.beginPath();
          var t = -Math.PI;
          var point = to(t);
          cx.moveTo(point.x, point.y);
          while (t < Math.PI) {
            t += 0.01;
            point = to(t);
            cx.lineTo(point.x, point.y);
          }
          cx.closePath();
          cx.fillStyle = '#4a9eff';
          cx.fill();
          var img = new Image();
          img.src = c.toDataURL();
          return img;
        })();

        function render() {
          requestAnimationFrame(render);
          var newTime = new Date().getTime() / 1000,
              deltaTime = newTime - (time || newTime);
          time = newTime;
          context.clearRect(0, 0, canvas.width, canvas.height);
          var amount = particleRate * deltaTime;
          for (var i = 0; i < amount; i++) {
            var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
            var dir = pos.clone().length(settings.particles.velocity);
            particles.add(canvas.width / 2 + pos.x, canvas.height / 2 - pos.y, dir.x, -dir.y);
          }
          particles.update(deltaTime);
          particles.draw(context, image);
        }

        function onResize() {
          canvas.width = canvas.clientWidth;
          canvas.height = canvas.clientHeight;
        }
        window.onresize = onResize;
        setTimeout(function() { onResize(); render(); }, 10);
      })(document.getElementById('pinkboard'));
    })();
  </script>

  <!-- ========== 粒子文字脚本（移动端优化） ========== -->
  <script>
    (function() {
      var canvas = document.getElementById('text-canvas');
      var ctx = canvas.getContext('2d');
      var textParticles = [];
      var mouse = { x: 0, y: 0 };
      var isMouseOver = false;
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      // 文字粒子设置 - 移动端使用更小的字体
      var textSettings = {
        text: '520 熊文蓉',
        fontSize: isMobile ? 80 : 150,
        particleSize: 2, // 更小的粒子
        particleGap: 5, // 更大的间距，减少粒子数量
        color: '#6ec6ff'
      };

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();

      function initTextParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 设置字体并绘制文字到离屏canvas
        ctx.font = 'bold ' + textSettings.fontSize + 'px "STKaiti", "KaiTi", "楷体", serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.fillText(textSettings.text, canvas.width / 2, canvas.height / 2);

        // 获取像素数据
        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var data = imageData.data;

        // 清空粒子数组
        textParticles = [];

        // 根据像素数据创建粒子
        for (var y = 0; y < canvas.height; y += textSettings.particleGap) {
          for (var x = 0; x < canvas.width; x += textSettings.particleGap) {
            var index = (y * canvas.width + x) * 4;
            var alpha = data[index + 3];
            if (alpha > 128) {
              textParticles.push({
                x: x,
                y: y,
                originX: x,
                originY: y,
                vx: 0,
                vy: 0,
                color: textSettings.color,
                size: Math.random() * textSettings.particleSize + 1
              });
            }
          }
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        console.log('粒子数量:', textParticles.length);
      }

      function drawTextParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (var i = 0; i < textParticles.length; i++) {
          var p = textParticles[i];

          // 计算与鼠标/触摸点的距离
          var dx = mouse.x - p.x;
          var dy = mouse.y - p.y;
          var dist = Math.sqrt(dx * dx + dy * dy);

          // 鼠标/触摸交互效果
          if (dist < 120 && isMouseOver) { // 增加互动半径
            var angle = Math.atan2(dy, dx);
            var force = (120 - dist) / 120;
            p.vx -= Math.cos(angle) * force * 8; // 增加推力
            p.vy -= Math.sin(angle) * force * 8;
          }

          // 回归原位置
          p.vx += (p.originX - p.x) * 0.05;
          p.vy += (p.originY - p.y) * 0.05;

          // 阻力
          p.vx *= 0.95;
          p.vy *= 0.95;

          // 更新位置
          p.x += p.vx;
          p.y += p.vy;

          // 绘制粒子
          ctx.fillStyle = p.color;
          ctx.globalAlpha = 0.8;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 1;
      }

      function animate() {
        drawTextParticles();
        requestAnimationFrame(animate);
      }

      // 鼠标移动事件
      window.addEventListener('mousemove', function(e) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        isMouseOver = true;
      });

      window.addEventListener('mouseout', function() {
        isMouseOver = false;
      });

      // 触摸事件（移动端）
      window.addEventListener('touchmove', function(e) {
        if (e.touches.length > 0) {
          mouse.x = e.touches[0].clientX;
          mouse.y = e.touches[0].clientY;
          isMouseOver = true;
        }
      }, { passive: true });

      window.addEventListener('touchend', function() {
        isMouseOver = false;
      }, { passive: true });

      // 窗口大小调整
      function onResize() {
        resizeCanvas();
        initTextParticles();
      }
      window.addEventListener('resize', onResize);

      // 初始化
      setTimeout(function() {
        onResize();
        animate();
      }, 100);

      // 8秒后切换到"很幸运能够认识你"
      setTimeout(function() {
        // 切换文字
        textSettings.text = '很幸运能够认识你';
        textSettings.fontSize = isMobile ? 60 : 120;
        textSettings.color = '#ff6ec6';
        initTextParticles();

        // 显示div版本（作为备用）
        var luckyText = document.getElementById('lucky-text');
        luckyText.classList.add('show');
      }, 8000);
    })();
  </script>

  <!-- ========== 音乐控制脚本（移动端优化） ========== -->
  <script>
    var audio = null;
    var isPlaying = false;
    var isInitialized = false;

    function initAudio() {
      if (isInitialized) return;

      audio = new Audio('background.mp3');
      audio.loop = true;
      audio.volume = 0.5;

      // iOS需要预加载
      audio.load();

      isInitialized = true;
      console.log('音频已初始化');
    }

    function playMusic() {
      if (!isInitialized) initAudio();

      if (!isPlaying) {
        // iOS Safari 需要通过用户手势触发
        var playPromise = audio.play();

        if (playPromise !== undefined) {
          playPromise.then(function() {
            isPlaying = true;
            document.getElementById('click-hint').style.display = 'none';
            console.log('音乐开始播放');
          }).catch(function(e) {
            console.error('播放失败:', e);
            // iOS可能需要再次点击
            document.getElementById('click-hint').innerHTML = '再次点击开启音乐 🎵';
          });
        }
      }
    }

    // 点击页面任意位置播放音乐
    document.addEventListener('click', function(e) {
      e.preventDefault();
      initAudio();
      playMusic();
    }, { once: false });

    // 触摸事件（移动端）
    document.addEventListener('touchstart', function(e) {
      initAudio();
      playMusic();
    }, { once: false, passive: true });

    // 页面加载时初始化音频（但不播放）
    window.addEventListener('load', function() {
      // 延迟初始化，确保页面完全加载
      setTimeout(function() {
        initAudio();
      }, 500);
    });

    // 防止双击缩放（iOS Safari）
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      var now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, false);
  </script>

</body>
</html>
